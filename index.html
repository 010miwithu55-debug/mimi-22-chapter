<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mimi's 22 Chapter birthday page" />
    <title>Mimi's 22 Chapter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section class="screen welcome-screen" id="welcome-screen" aria-labelledby="welcome-title">
        <div class="cover-bubbles" aria-hidden="true">
          <span class="cover-bubble cover-bubble--one"></span>
          <span class="cover-bubble cover-bubble--two"></span>
          <span class="cover-bubble cover-bubble--three"></span>
          <span class="cover-bubble cover-bubble--four"></span>
          <span class="cover-bubble cover-bubble--five"></span>
        </div>
        <div class="title-area" id="welcome-title" aria-label="WELCOME TO MIMI'S 22 CHAPTER">
          <p class="title-line title-line--welcome" aria-hidden="true">
            <span class="title-word title-word--welcome"><span class="title-letter" style="--letter-delay: .5s">W</span><span class="title-letter" style="--letter-delay: .54s">E</span><span class="title-letter" style="--letter-delay: .58s">L</span><span class="title-letter" style="--letter-delay: .62s">C</span><span class="title-letter" style="--letter-delay: .66s">O</span><span class="title-letter" style="--letter-delay: .70s">M</span><span class="title-letter" style="--letter-delay: .74s">E</span></span>
            <span class="title-word title-word--to"><span class="title-letter" style="--letter-delay: .82s">T</span><span class="title-letter" style="--letter-delay: .86s">O</span></span>
          </p>
          <p class="title-line title-line--mimi" aria-hidden="true">
            <span class="title-word title-word--mimi"><span class="title-letter" style="--letter-delay: 1.3s">M</span><span class="title-letter" style="--letter-delay: 1.38s">I</span><span class="title-letter" style="--letter-delay: 1.46s">M</span><span class="title-letter" style="--letter-delay: 1.54s">I</span><span class="title-letter" style="--letter-delay: 1.62s">'</span><span class="title-letter" style="--letter-delay: 1.70s">S</span></span>
          </p>
          <p class="title-line title-line--chapter" aria-hidden="true">
            <span class="title-word title-word--twenty-two"><span class="title-letter" style="--letter-delay: 2.1s">2</span><span class="title-letter" style="--letter-delay: 2.1s">2</span></span>
            <span class="title-word title-word--chapter"><span class="title-letter" style="--letter-delay: 2.1s">C</span><span class="title-letter" style="--letter-delay: 2.1s">H</span><span class="title-letter" style="--letter-delay: 2.1s">A</span><span class="title-letter" style="--letter-delay: 2.1s">P</span><span class="title-letter" style="--letter-delay: 2.1s">T</span><span class="title-letter" style="--letter-delay: 2.1s">E</span><span class="title-letter" style="--letter-delay: 2.1s">R</span></span>
          </p>
        </div>
        <a class="enter-button" id="enter-button" href="room.html">Open my chapter ♡</a>
      </section>
    </main>
    <script>
      const enterButton = document.querySelector("#enter-button");

      if (window.matchMedia("(pointer: fine)").matches) {
        const cursor = document.createElement("span");
        const cursorShape = document.createElement("span");
        cursor.className = "custom-cursor custom-cursor--bubble";
        cursorShape.className = "custom-cursor__shape";
        cursor.append(cursorShape);
        document.body.append(cursor);
        document.body.classList.add("has-custom-cursor");

        document.addEventListener("pointermove", (event) => {
          cursor.style.transform = `translate3d(${event.clientX}px, ${event.clientY}px, 0) translate(-50%, -50%)`;
          cursor.classList.add("is-ready");
        });
        document.addEventListener("pointerdown", () => {
          cursor.classList.remove("is-clicking");
          void cursor.offsetWidth;
          cursor.classList.add("is-clicking");
        });
        cursorShape.addEventListener("animationend", (event) => {
          if (event.animationName === "cursor-pop") cursor.classList.remove("is-clicking");
        });
      }

      window.setTimeout(() => {
        enterButton.classList.add("is-visible");
      }, 3050);

      enterButton.addEventListener("click", () => {
        sessionStorage.setItem("mimi-22-play-melody", "1");
      });
    </script>
  </body>
</html>
