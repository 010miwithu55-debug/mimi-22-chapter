<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mimi's 22 Chapter birthday room" />
    <title>Mimi's 22 Chapter — Room</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      :root {
        --flame-top: 1%;
        --flame-left: 46%;
        --bubble-opacity: 0.75;
        --bubble-speed: 0.87;
      }

      .room-screen {
        isolation: isolate;
      }

      /* Desktop keeps the original room stage. On mobile this becomes a separate
         canvas that matches the full portrait background image. */
      .room-mobile-canvas {
        display: contents;
      }

      .room-item {
        position: absolute;
        display: block;
        height: auto;
        user-select: none;
        pointer-events: auto;
        transition: transform 180ms ease;
      }

      .room-screen:not(.is-editing) .mimi:hover,
      .room-screen:not(.is-editing) .dog:hover,
      .room-screen:not(.is-editing) .cake:hover { transform: scale(1.07); }

      .room-screen:not(.is-editing) .camera:hover { transform: rotate(-6deg) scale(1.07); }
      .room-screen:not(.is-editing) .notebook:hover { transform: rotate(7deg) scale(1.07); }

      .birthday-bubble {
        position: absolute;
        z-index: 1;
        width: var(--bubble-size);
        aspect-ratio: 1;
        bottom: -12%;
        cursor: pointer;
        opacity: var(--bubble-opacity);
        pointer-events: none;
        background: radial-gradient(circle at 32% 24%, rgb(255 255 255 / 92%) 0 7%, rgb(255 255 255 / 32%) 8% 18%, transparent 19%), var(--bubble-color);
        border: 2px solid rgb(255 255 255 / 68%);
        border-radius: 50% 48% 52% 49%;
        box-shadow: inset -5px -7px 10px rgb(255 255 255 / 28%), inset 4px 5px 8px rgb(255 255 255 / 14%), 2px 4px 0 rgb(165 84 122 / 16%);
        will-change: transform, opacity;
        animation: bubble-rise var(--bubble-duration) linear var(--bubble-delay) forwards;
      }

      .birthday-bubble::after {
        content: none;
      }

      .room-screen.is-editing .birthday-bubble {
        pointer-events: none;
        opacity: 0.3;
      }

      .birthday-bubble.is-popped {
        pointer-events: none;
        animation: none;
      }

      .bubble-confetti {
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: 9;
        width: 0.4rem;
        height: 0.58rem;
        background: var(--paper-color);
        border-radius: 2px 4px 2px 5px;
        box-shadow: 1px 1px 0 rgb(125 67 90 / 13%);
        pointer-events: none;
        animation: bubble-confetti var(--particle-duration) cubic-bezier(.18, .78, .35, 1) forwards;
      }

      .bubble-confetti--ribbon {
        width: 0.22rem;
        height: 1.08rem;
        border-radius: 999px 999px 4px 4px;
      }

      @keyframes bubble-rise {
        0% { opacity: 0; transform: translate(0, 0) scale(0.78) rotate(-4deg); }
        8% { opacity: var(--bubble-opacity); }
        48% { opacity: var(--bubble-opacity); transform: translate(var(--bubble-drift-mid), -54svh) scale(var(--bubble-mid-scale)) rotate(4deg); }
        88% { opacity: var(--bubble-opacity); }
        100% { opacity: 0; transform: translate(var(--bubble-drift-end), -119svh) scale(0.94) rotate(-5deg); }
      }

      @keyframes bubble-pop {
        from { opacity: 1; transform: scale(1); }
        40% { opacity: 0.9; transform: scale(1.18); }
        to { opacity: 0; transform: scale(0.12); }
      }

      @keyframes bubble-confetti {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.35) rotate(0); }
        12% { opacity: 1; transform: translate(calc(-50% + var(--burst-x-near)), calc(-50% + var(--burst-y-near))) scale(1) rotate(35deg); }
        58% { opacity: 1; transform: translate(calc(-50% + var(--burst-x-mid)), calc(-50% + var(--burst-y-mid))) scale(1.05) rotate(var(--particle-spin-mid)); }
        100% { opacity: 0; transform: translate(calc(-50% + var(--burst-x)), calc(-50% + var(--burst-y-end))) scale(0.72) rotate(var(--particle-spin)); }
      }

      .mimi.is-celebrating,
      .dog.is-celebrating { animation: character-bounce 620ms cubic-bezier(.18, .9, .25, 1.22); }

      .character-feedback {
        position: fixed;
        z-index: 26;
        min-width: 5.6rem;
        padding: 0.45rem 0.65rem;
        color: #a34d76;
        text-align: center;
        pointer-events: none;
        background: #fff6fa;
        border: 2px dashed #e39ab7;
        border-radius: 10px 13px 9px 12px;
        box-shadow: 2px 3px 0 rgb(181 79 123 / 18%);
        animation: character-feedback-float 1.8s cubic-bezier(.2, .75, .25, 1) forwards;
      }

      .character-feedback-main {
        display: block;
        font: 800 1rem/1 "Marker Felt", "Bradley Hand", "Comic Sans MS", cursive;
      }

      .character-feedback-sub {
        display: block;
        margin-top: 0.22rem;
        color: #b57890;
        font: 700 0.68rem/1.2 "Marker Felt", "Bradley Hand", "Comic Sans MS", cursive;
      }

      .feedback-particle {
        position: absolute;
        top: 50%;
        left: 50%;
        color: var(--particle-color, #f3b85e);
        font-size: 0.9rem;
        line-height: 1;
        opacity: 0;
        animation: feedback-particle 1.25s ease-out var(--particle-delay, 120ms) forwards;
      }

      .feedback-particle--one { --particle-x: -2.3rem; --particle-y: -1.4rem; --particle-x-near: -1rem; --particle-y-near: -0.6rem; --particle-color: #f1ba5e; }
      .feedback-particle--two { --particle-x: 2.1rem; --particle-y: -1.8rem; --particle-x-near: 0.9rem; --particle-y-near: -0.8rem; --particle-color: #ef8fae; }
      .feedback-particle--three { --particle-x: -1.8rem; --particle-y: 1rem; --particle-x-near: -0.8rem; --particle-y-near: 0.45rem; --particle-color: #ef8fae; --particle-delay: 180ms; }
      .feedback-particle--four { --particle-x: 2.2rem; --particle-y: 0.8rem; --particle-x-near: 1rem; --particle-y-near: 0.35rem; --particle-color: #f1ba5e; --particle-delay: 220ms; }

      @keyframes character-bounce {
        0%, 100% { transform: translateY(0) scale(1); }
        35% { transform: translateY(-7px) scale(1.1, 0.94); }
        58% { transform: translateY(1px) scale(0.96, 1.05); }
        78% { transform: translateY(-2px) scale(1.03, 0.98); }
      }

      @keyframes character-feedback-float {
        0% { opacity: 0; transform: translate(-50%, 9px) scale(0.55) rotate(-3deg); }
        20% { opacity: 1; transform: translate(-50%, 0) scale(1.06) rotate(1deg); }
        38% { opacity: 1; transform: translate(-50%, -2px) scale(1) rotate(-1deg); }
        64% { opacity: 1; transform: translate(-50%, -1.8rem) scale(1) rotate(1deg); }
        100% { opacity: 0; transform: translate(-50%, -4.8rem) scale(0.94) rotate(2deg); }
      }

      @keyframes feedback-particle {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3) rotate(0); }
        22% { opacity: 1; transform: translate(calc(-50% + var(--particle-x-near)), calc(-50% + var(--particle-y-near))) scale(1) rotate(25deg); }
        100% { opacity: 0; transform: translate(calc(-50% + var(--particle-x)), calc(-50% + var(--particle-y))) scale(0.75) rotate(80deg); }
      }

      .hover-tooltip {
        position: fixed;
        z-index: 20;
        max-width: min(15rem, 78vw);
        padding: 0.55rem 0.75rem;
        color: #8d4263;
        font: 700 0.9rem/1.35 "Marker Felt", "Bradley Hand", "Comic Sans MS", cursive;
        text-align: center;
        background: #fff6fa;
        border: 2px dashed #de91b0;
        border-radius: 10px 13px 9px 12px;
        box-shadow: 3px 4px 0 rgb(181 79 123 / 20%);
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, calc(-100% - 12px)) scale(0.82) rotate(-1.5deg);
        transition: opacity 150ms ease, transform 180ms ease;
      }

      .hover-tooltip.is-visible {
        opacity: 1;
        transform: translate(-50%, calc(-100% - 12px)) scale(1) rotate(-1.5deg);
      }

      .camera-flash {
        position: fixed;
        inset: 0;
        z-index: 29;
        pointer-events: none;
        background: #fff;
        opacity: 0;
      }

      .camera-flash.is-flashing { animation: camera-flash 420ms ease-out; }

      .memory-overlay {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: grid;
        place-items: center;
        padding: clamp(1rem, 3vw, 2.5rem);
        overflow: hidden;
        background: rgb(105 47 76 / 42%);
        opacity: 0;
        visibility: hidden;
        transition: opacity 220ms ease, visibility 220ms ease;
      }

      .memory-overlay.is-open {
        opacity: 1;
        visibility: visible;
      }

      .notebook-overlay {
        position: fixed;
        inset: 0;
        z-index: 31;
        display: grid;
        place-items: center;
        padding: 1rem;
        overflow: visible;
        background: rgb(105 47 76 / 42%);
        opacity: 0;
        visibility: hidden;
        transition: opacity 240ms ease, visibility 240ms ease;
      }

      .notebook-overlay.is-open {
        opacity: 1;
        visibility: visible;
      }

      .cake-overlay {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 32;
        display: grid;
        place-items: center;
        padding: 1rem;
        overflow: hidden;
        background: rgb(105 47 76 / 46%);
        opacity: 0;
        visibility: hidden;
        transition: opacity 240ms ease, visibility 240ms ease;
      }

      .cake-overlay.is-open {
        opacity: 1;
        visibility: visible;
      }

      .cake-celebration {
        position: relative;
        justify-self: center;
        align-self: center;
        width: min(90vw, 34rem);
        margin: 0;
        padding: clamp(1.5rem, 4vw, 2.7rem);
        text-align: center;
        background: #fff0f6;
        border: 2px dashed #e79ab9;
        border-radius: 24px 30px 22px 28px;
        box-shadow: 8px 10px 0 rgb(120 46 80 / 18%);
        transform-origin: center;
        transform: scale(0.94) rotate(0.8deg);
        transition: transform 280ms cubic-bezier(.2, .85, .25, 1.12);
      }

      .cake-overlay.is-open .cake-celebration { transform: scale(1) rotate(0.8deg); }

      .cake-title {
        margin: 0;
        color: #ab4c77;
        font: 800 clamp(1.8rem, 5vw, 3rem)/1 "Marker Felt", "Bradley Hand", "Comic Sans MS", cursive;
      }

      .cake-subtitle {
        margin: 0.45rem 0 1rem;
        color: #a67087;
        font: italic 0.95rem/1.4 Georgia, serif;
      }

      .cake-close {
        position: absolute;
        top: 0.8rem;
        right: 0.9rem;
        width: 2.2rem;
        height: 2.2rem;
        color: #ba638b;
        font: 700 1.25rem/1 sans-serif;
        cursor: pointer;
        background: #fff9fc;
        border: 2px solid #e6a6c1;
        border-radius: 50%;
      }

      .cake-stage {
        position: relative;
        width: min(72vw, 20rem);
        margin: 0 auto;
        cursor: pointer;
      }

      .cake-stage > img { display: block; width: 100%; height: auto; }

      .cake-flame {
        position: absolute;
        top: var(--flame-top);
        left: var(--flame-left);
        width: 7%;
        aspect-ratio: 0.62;
        background: linear-gradient(#fff7a6, #ff9b62 65%, #f3708d);
        border-radius: 60% 60% 65% 65%;
        box-shadow: 0 0 15px #ffd77b;
        transform-origin: 50% 100%;
        animation: flame-flicker 700ms ease-in-out infinite alternate;
      }

      .cake-candle-mask {
        position: absolute;
        top: calc(var(--flame-top) - 1%);
        left: calc(var(--flame-left) - 1.5%);
        width: 10%;
        height: 10%;
        background: #fff0f6;
        border-radius: 50% 50% 35% 35%;
        opacity: 0;
      }

      .cake-smoke {
        position: absolute;
        top: var(--flame-top);
        left: var(--flame-left);
        width: 5%;
        aspect-ratio: 1;
        background: rgb(205 196 207 / 72%);
        border-radius: 50%;
        opacity: 0;
      }

      .cake-star {
        position: absolute;
        top: 20%;
        left: 50%;
        color: #f2b956;
        font-size: clamp(1rem, 4vw, 1.8rem);
        opacity: 0;
        pointer-events: none;
      }

      .cake-stage.is-blown .cake-flame { opacity: 0; animation: none; }
      .cake-stage.is-blown .cake-candle-mask { opacity: 1; }
      .cake-stage.is-blown .cake-smoke { animation: smoke-rise 950ms ease-out forwards; }
      .cake-stage.is-blown .cake-star { animation: star-burst 800ms ease-out forwards; }
      .cake-stage.is-blown .cake-star:nth-of-type(4) { animation-delay: 80ms; }
      .cake-stage.is-blown .cake-star:nth-of-type(5) { animation-delay: 150ms; }

      .cake-star--left { --x: -6rem; --y: -3rem; }
      .cake-star--right { --x: 5rem; --y: -3.5rem; }
      .cake-star--top { --x: 0.5rem; --y: -5rem; }

      .cake-result {
        margin: 0.5rem 0 0;
        color: #bf5c88;
        font: 800 clamp(1.05rem, 3.2vw, 1.55rem)/1.25 "Marker Felt", "Bradley Hand", "Comic Sans MS", cursive;
        opacity: 0;
        transform: translateY(8px) scale(0.95);
        transition: opacity 260ms ease, transform 260ms ease;
      }

      .cake-celebration.is-finished .cake-result { opacity: 1; transform: translateY(0) scale(1); }

      @keyframes flame-flicker {
        from { transform: rotate(-5deg) scale(0.92, 1.05); }
        to { transform: rotate(5deg) scale(1.05, 0.93); }
      }

      @keyframes smoke-rise {
        0% { opacity: 0; transform: translate(0, 0) scale(0.5); }
        20% { opacity: 0.75; }
        100% { opacity: 0; transform: translate(1rem, -4rem) scale(2.2); }
      }

      @keyframes star-burst {
        0% { opacity: 0; transform: translate(0, 0) scale(0.4) rotate(0); }
        30% { opacity: 1; }
        100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(1.15) rotate(100deg); }
      }

      .notebook-page {
        position: relative;
        --note-paper-width: min(100%, 56.2svh, 31.85rem);
        width: min(75vw, 68rem);
        height: min(85svh, 48rem);
        padding: clamp(2.5rem, 7vw, 4.5rem) clamp(1.4rem, 6vw, 4rem) 1.5rem;
        text-align: center;
        background: url("assets/backgrounds/melody-paper.png") center / contain no-repeat;
        transform: scale(0.94) rotate(-1deg);
        transition: transform 300ms cubic-bezier(.2, .85, .25, 1.12);
      }

      .note-board { position: relative; }

      .notebook-overlay.is-open .notebook-page { transform: scale(1) rotate(-1deg); }

      .notebook-title {
        position: absolute;
        top: 10%;
        left: 50%;
        width: var(--note-paper-width);
        margin: 0;
        color: #c66f9c;
        font: 800 clamp(1.35rem, 3.5vw, 2.15rem)/1.1 "Marker Felt", "Bradley Hand", "Comic Sans MS", cursive;
        transform: translateX(-50%);
      }

      .notebook-subtitle {
        position: absolute;
        top: 18%;
        left: 50%;
        width: var(--note-paper-width);
        margin: 0;
        color: #aa7892;
        font: italic 0.95rem/1.4 Georgia, serif;
        transform: translateX(-50%);
      }

      .notebook-close {
        position: fixed;
        top: 1.25rem;
        right: 1.5rem;
        z-index: 9999;
        width: 2.2rem;
        height: 2.2rem;
        color: #bc668e;
        font: 700 1.25rem/1 sans-serif;
        cursor: pointer;
        background: #fff9fc;
        border: 2px solid #e6a6c1;
        border-radius: 50%;
        box-shadow: 2px 3px 0 rgb(169 71 115 / 16%);
      }

      .message-form {
        position: absolute;
        top: 25%;
        left: 50%;
        display: grid;
        gap: 0.55rem;
        width: min(var(--note-paper-width), 28rem);
        margin: 0;
        transform: translateX(-50%);
      }

      .message-form input,
      .message-form textarea {
        width: 100%;
        color: #8f5870;
        font: 0.95rem/1.4 "Marker Felt", "Bradley Hand", "Comic Sans MS", cursive;
        background: rgb(255 255 255 / 64%);
        border: 1px dashed #df9eb8;
        border-radius: 8px 11px 7px 10px;
        outline: none;
      }

      .message-form input { padding: 0.55rem 0.75rem; }
      .message-form textarea { min-height: 4.6rem; padding: 0.6rem 0.75rem; resize: none; }
      .message-form input:focus,
      .message-form textarea:focus { border-color: #c86b96; box-shadow: 0 0 0 3px rgb(239 181 205 / 34%); }

      .message-submit {
        justify-self: center;
        padding: 0.6rem 1rem;
        color: #a74d75;
        font: 700 1rem "Marker Felt", "Bradley Hand", "Comic Sans MS", cursive;
        cursor: pointer;
        background: #ffe3ef;
        border: 2px dashed #dc8cad;
        border-radius: 7px 11px 6px 10px;
        box-shadow: 2px 3px 0 rgb(173 77 118 / 19%);
      }

      .message-cards {
        position: absolute;
        top: 49%;
        left: 50%;
        width: var(--note-paper-width);
        height: clamp(10rem, 30vh, 15rem);
        margin: 0;
        overflow: hidden;
        transform: translateX(-50%);
      }

      .message-card {
        position: absolute;
        width: min(22%, 6.3rem);
        aspect-ratio: 1;
        color: #715b4e;
        filter: drop-shadow(3px 5px 5px rgb(126 66 83 / 22%));
        animation: message-card-appear 260ms ease-out both;
      }

      .note-card-background {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
      }

      .note-content {
        position: absolute;
        inset: 24% 18% 27%;
        z-index: 1;
        display: grid;
        align-content: center;
        gap: 0.25rem;
        overflow: hidden;
        text-align: center;
      }

      .message-card-name { margin: 0; color: #bd668d; font: 700 clamp(0.38rem, 0.95vw, 0.55rem) "Marker Felt", "Bradley Hand", "Comic Sans MS", cursive; overflow-wrap: anywhere; }
      .message-card-text { margin: 0; font: clamp(0.34rem, 0.85vw, 0.5rem)/1.2 "Marker Felt", "Bradley Hand", "Comic Sans MS", cursive; overflow-wrap: anywhere; }

      .message-actions {
        position: absolute;
        top: -0.55rem;
        right: -0.45rem;
        z-index: 3;
        display: flex;
        gap: 0.2rem;
        opacity: 0;
        transform: translateY(3px) scale(0.88);
        transition: opacity 160ms ease, transform 160ms ease;
      }

      .message-card:hover .message-actions,
      .message-card:focus-within .message-actions {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      .message-actions button {
        padding: 0.22rem 0.35rem;
        color: #a64f77;
        font: 700 0.52rem "Marker Felt", "Bradley Hand", "Comic Sans MS", cursive;
        white-space: nowrap;
        cursor: pointer;
        background: #fff8fb;
        border: 1px dashed #df9eb8;
        border-radius: 5px;
        box-shadow: 1px 2px 0 rgb(181 79 123 / 16%);
      }

      .message-pagination {
        position: absolute;
        bottom: 7%;
        left: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.65rem;
        margin: 0;
        color: #bd668d;
        font: 700 0.7rem "Marker Felt", "Bradley Hand", "Comic Sans MS", cursive;
        transform: translateX(-50%);
      }

      .message-pagination button {
        width: 1.65rem;
        height: 1.4rem;
        color: #b65d86;
        cursor: pointer;
        background: rgb(255 249 252 / 70%);
        border: 1px dashed #df9eb8;
        border-radius: 6px;
      }

      .message-pagination button:disabled { cursor: default; opacity: 0.4; }

      @keyframes message-card-appear {
        from { opacity: 0; transform: translateY(8px) scale(0.9) rotate(var(--card-rotation)); }
        to { opacity: 1; transform: translateY(0) scale(1) rotate(var(--card-rotation)); }
      }

      .memory-box {
        position: relative;
        width: min(100%, 68rem);
        height: min(88svh, calc(100svh - 5rem), 48rem);
        padding: clamp(1.1rem, 3vw, 2.25rem);
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        overflow: hidden;
        background: #ffeef4;
        border: 2px dashed #e59ab8;
        border-radius: 20px 27px 18px 24px;
        box-shadow: 8px 10px 0 rgb(120 46 80 / 18%);
        transform: scale(0.94) rotate(-0.8deg);
        transition: transform 260ms cubic-bezier(.2, .85, .25, 1.12);
      }

      .memory-overlay.is-open .memory-box { transform: scale(1) rotate(-0.8deg); }

      .memory-title {
        margin: 0;
        color: #a94773;
        font: 800 clamp(1.45rem, 4vw, 2.5rem)/1.1 "Marker Felt", "Bradley Hand", "Comic Sans MS", cursive;
        text-align: center;
      }

      .memory-subtitle {
        margin: 0.45rem 0 1rem;
        color: #a86c83;
        font: italic 1rem/1.4 Georgia, serif;
        text-align: center;
      }

      .memory-close {
        position: absolute;
        top: 0.8rem;
        right: 0.9rem;
        width: 2.25rem;
        height: 2.25rem;
        color: #a94773;
        font: 700 1.25rem/1 sans-serif;
        cursor: pointer;
        background: #fff9fb;
        border: 2px solid #e59ab8;
        border-radius: 50%;
        box-shadow: 2px 3px 0 rgb(169 71 115 / 20%);
      }

      .memory-wall {
        position: relative;
        min-height: 0;
        overflow: hidden;
      }

      .memory-photo {
        position: absolute;
        display: block;
        z-index: 1;
        height: auto;
        object-fit: contain;
        filter: drop-shadow(3px 6px 5px rgb(116 50 79 / 22%));
        transform-origin: center;
        cursor: zoom-in;
        transition: transform 220ms ease, filter 220ms ease;
      }

      .memory-photo-note {
        position: absolute;
        z-index: 4;
        max-width: 12rem;
        padding: 0.45rem 0.65rem;
        color: #98506e;
        font: 700 0.8rem/1.3 "Marker Felt", "Bradley Hand", "Comic Sans MS", cursive;
        text-align: center;
        background: #fff7fa;
        border: 2px dashed #e39ab7;
        border-radius: 9px 12px 8px 11px;
        box-shadow: 2px 3px 0 rgb(181 79 123 / 18%);
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, calc(-100% - 8px)) scale(0.85) rotate(-1.5deg);
        transition: opacity 150ms ease, transform 180ms ease;
      }

      .memory-photo-note.is-visible {
        opacity: 1;
        transform: translate(-50%, calc(-100% - 8px)) scale(1) rotate(-1.5deg);
      }

  <body>

      const defaultRoomLayout = {

      const mobileDefaultRoomLayout = {
        mimi: { left: 25.00, top: 25.92, width: 75.00, height: 52.94 },
        dog: { left: 61.00, top: 69.35, width: 39.00, height: 19.62 },
        cake: { left: 10.50, top: 69.61, width: 38.30, height: 21.67 },

      const messageStorageKey = "mimi-22-notebook-messages";

      let setRoomCursorType = () => {};
      if (window.matchMedia("(pointer: fine)").matches) {
        const cursor = document.createElement("span");
        const cursorShape = document.createElement("span");
        cursor.className = "custom-cursor custom-cursor--sparkle";
        cursorShape.className = "custom-cursor__shape";
        cursor.append(cursorShape);
        document.body.append(cursor);
        document.body.classList.add("has-custom-cursor");

        setRoomCursorType = (type) => {
          cursor.classList.toggle("custom-cursor--sparkle", type === "sparkle");
          cursor.classList.toggle("custom-cursor--heart", type === "heart");
          cursorShape.textContent = type === "heart" ? "♥" : "";
        };

        document.addEventListener("pointermove", (event) => {
          cursor.style.transform = `translate3d(${event.clientX}px, ${event.clientY}px, 0) translate(-50%, -50%)`;
          cursor.classList.add("is-ready");
        });
        document.addEventListener("pointerdown", () => {
          cursor.classList.remove("is-clicking");
          void cursor.offsetWidth;
          cursor.classList.add("is-clicking");
        });
        cursorShape.addEventListener("animationend", (event) => {
          if (event.animationName === "cursor-pop") cursor.classList.remove("is-clicking");
        });
      }

      try {
        shouldStartMusic = sessionStorage.getItem("mimi-22-play-melody") === "1";
        sessionStorage.removeItem("mimi-22-play-melody");
      } catch {
        shouldStartMusic = false;
      }

      const clamp = (value, minimum, maximum) => Math.min(Math.max(value, minimum), maximum);
      const isMobileRoom = () => mobileRoomQuery.matches;
      const getLayoutStage = () => isMobileRoom() ? mobileRoomCanvas : roomStage;

      function popBirthdayBubble(bubble) {
        if (editing || bubble.classList.contains("is-popped")) return;
        const bubbleRect = bubble.getBoundingClientRect();
        const stageRect = roomStage.getBoundingClientRect();
        const currentTransform = getComputedStyle(bubble).transform;
        const popTransform = currentTransform === "none" ? "" : currentTransform;
        bubble.style.animation = "none";
        bubble.style.transform = currentTransform;
        bubble.classList.add("is-popped");
        bubble.animate([
          { opacity: 1, transform: popTransform },
          { opacity: 0.9, transform: `${popTransform} scale(1.18)` },
          { opacity: 0, transform: `${popTransform} scale(0.12)` },
        ], {
          duration: 260,
          easing: "cubic-bezier(.2, .75, .3, 1)",
          fill: "forwards",
        });
        for (let index = 0; index < 16; index += 1) {
          const particle = document.createElement("span");
          const angle = (Math.PI * 2 * index) / 12 + randomBetween(-0.16, 0.16);
          const distance = randomBetween(2.2, 4.4);
          const burstX = Math.cos(angle) * distance;
          const burstY = Math.sin(angle) * distance;
          particle.className = "bubble-confetti";
          if (index % 3 === 0) particle.classList.add("bubble-confetti--ribbon");
          particle.style.setProperty("--paper-color", paperColors[Math.floor(Math.random() * paperColors.length)]);
          particle.style.setProperty("--burst-x-near", `${burstX * 0.25}rem`);
          particle.style.setProperty("--burst-y-near", `${burstY * 0.25}rem`);
          particle.style.setProperty("--burst-x-mid", `${burstX * 0.78}rem`);
          particle.style.setProperty("--burst-y-mid", `${burstY * 0.78}rem`);
          particle.style.setProperty("--burst-x", `${burstX}rem`);
          particle.style.setProperty("--burst-y-end", `${burstY + randomBetween(1.8, 3.2)}rem`);
          particle.style.setProperty("--particle-spin-mid", `${randomBetween(100, 280)}deg`);
          particle.style.setProperty("--particle-spin", `${randomBetween(320, 720)}deg`);
          particle.style.setProperty("--particle-duration", `${randomBetween(850, 1150)}ms`);
          particle.style.left = `${bubbleRect.left - stageRect.left + bubbleRect.width / 2}px`;
          particle.style.top = `${bubbleRect.top - stageRect.top + bubbleRect.height / 2}px`;
          particle.addEventListener("animationend", () => particle.remove());
          roomStage.append(particle);

        window.setTimeout(() => {

      function scatterMemoryPhotos() {
        const wallRect = memoryWall.getBoundingClientRect();
        if (!wallRect.width || !wallRect.height) return;
        const shuffledPhotos = shuffle(memoryPhotos);

        shuffledPhotos.forEach((photo, index) => {
          const zone = photoZones[index];
          const scale = randomBetween(0.9, 1.05);
          const rotation = randomBetween(-8, 8);
          const zoneWidth = wallRect.width * (zone.width / 100);
          const zoneHeight = wallRect.height * (zone.height / 100);
          const insetX = zoneWidth * 0.08;
          const insetY = zoneHeight * 0.08;
          const ratio = photo.naturalWidth / photo.naturalHeight || 0.75;
          const baseWidth = Math.min(
            (zoneWidth - insetX * 2) / 1.05,
            ((zoneHeight - insetY * 2) * ratio) / 1.05,
          );
          const baseHeight = baseWidth / ratio;
          const visualWidth = baseWidth * scale;
          const visualHeight = baseHeight * scale;
          const zoneLeft = wallRect.width * (zone.left / 100);
          const zoneTop = wallRect.height * (zone.top / 100);
          const centerX = randomBetween(
            zoneLeft + insetX + visualWidth / 2,
            zoneLeft + zoneWidth - insetX - visualWidth / 2,
          );
          const centerY = randomBetween(
            zoneTop + insetY + visualHeight / 2,
            zoneTop + zoneHeight - insetY - visualHeight / 2,
          );

          photo.style.width = `${baseWidth}px`;
          photo.style.left = `${centerX - baseWidth / 2}px`;
          photo.style.top = `${centerY - baseHeight / 2}px`;
          photo.dataset.baseTransform = `rotate(${rotation}deg) scale(${scale})`;
          photo.dataset.baseRotation = rotation;
          photo.dataset.baseScale = scale;
          photo.style.transform = photo.dataset.baseTransform;
          photo.style.zIndex = 1;
          memoryWall.insertBefore(photo, memoryStickers);
        });

        [...memoryStickers.children].forEach((sticker, index) => {
          const anchor = stickerAnchors[index % stickerAnchors.length];
          sticker.style.width = `${randomBetween(2.5, 4.5)}%`;
          sticker.style.left = `${anchor.left + randomBetween(-1.2, 1.2)}%`;
          sticker.style.top = `${anchor.top + randomBetween(-1.2, 1.2)}%`;
          sticker.style.transform = `rotate(${randomBetween(-25, 25)}deg)`;
        });
      }

      function getParameters(item) {
        const stageRect = getLayoutStage().getBoundingClientRect();
        const itemRect = item.getBoundingClientRect();
        const useLayoutSize = usesLayoutMetrics(item);
        const widthPixels = useLayoutSize ? item.offsetWidth : itemRect.width;
        const heightPixels = useLayoutSize ? item.offsetHeight : itemRect.height;
        const leftPixels = useLayoutSize ? item.offsetLeft : itemRect.left - stageRect.left;
        const topPixels = useLayoutSize ? item.offsetTop : itemRect.top - stageRect.top;
        return {
          left: (leftPixels / stageRect.width) * 100,
          top: (topPixels / stageRect.height) * 100,
          width: (widthPixels / stageRect.width) * 100,
          height: (heightPixels / stageRect.height) * 100,
          widthPixels,
        };
      }

      function applyParameters(item, parameters) {
        item.style.left = `${parameters.left}%`;
        item.style.top = `${parameters.top}%`;
        item.style.bottom = "auto";
        item.style.width = `${parameters.width}%`;
      }

      function showParameters(item) {
        const parameters = getParameters(item);
        readout.textContent = `${item.classList[1]}:\nleft: ${parameters.left.toFixed(2)}%\ntop: ${parameters.top.toFixed(2)}%\nwidth: ${parameters.widthPixels.toFixed(0)}px (${parameters.width.toFixed(2)}%)`;
      }

      function normalizeItem(item) {
        applyParameters(item, getParameters(item));
      }

      function captureLayout() {
        return Object.fromEntries(roomItems.map((item) => {
          const parameters = getParameters(item);
          return [item.dataset.layoutKey, {
            left: parameters.left,
            top: parameters.top,
            width: parameters.width,
            height: parameters.height,
          }];
        }));
      }

      function applyLayout(layout) {
        roomItems.forEach((item) => {
          const parameters = layout[item.dataset.layoutKey];
          if (!parameters || ![parameters.left, parameters.top, parameters.width].every(Number.isFinite)) return;
          applyParameters(item, parameters);
        });
        isNormalized = true;
      }

      function isValidLayout(layout) {
        return roomItems.every((item) => {
          const parameters = layout?.[item.dataset.layoutKey];
          return parameters && [parameters.left, parameters.top, parameters.width].every(Number.isFinite);
        });
      }

      function showSavedLayout(layout) {
        const output = Object.fromEntries(Object.entries(layout).map(([name, parameters]) => [name, {
          left: `${parameters.left.toFixed(2)}%`,
          top: `${parameters.top.toFixed(2)}%`,
          width: `${parameters.width.toFixed(2)}%`,
          height: `${parameters.height.toFixed(2)}%`,
        }]));
        readout.textContent = `Saved layout:\n${JSON.stringify(output, null, 2)}`;
        readout.hidden = false;
      }

      function setEditing(nextEditing) {
        editing = nextEditing;
        roomStage.classList.toggle("is-editing", editing);
        hideHoverTooltip();
        editToggle.textContent = editing ? "Finish editing" : "Edit room";
        editToggle.setAttribute("aria-pressed", String(editing));
        readout.hidden = !editing;

        if (editing) {
          if (!isNormalized) {
            roomItems.forEach(normalizeItem);
            isNormalized = true;
          }
          showParameters(roomItems[0]);
        }
      }

      editToggle.addEventListener("click", () => setEditing(!editing));

      saveLayout.addEventListener("click", () => {
        if (!isNormalized) {
          roomItems.forEach(normalizeItem);
          isNormalized = true;
        }
        const layout = captureLayout();
        localStorage.setItem(getLayoutStorageKey(), JSON.stringify(layout));
        showSavedLayout(layout);
      });

      roomItems.forEach((item) => {
        item.addEventListener("pointerenter", () => showHoverTooltip(item));
        item.addEventListener("pointerleave", hideHoverTooltip);

        item.addEventListener("pointerdown", (event) => {
          if (!editing) return;
          const itemRect = item.getBoundingClientRect();
          dragState = { item, offsetX: event.clientX - itemRect.left, offsetY: event.clientY - itemRect.top };
          item.classList.add("is-dragging");
          item.setPointerCapture(event.pointerId);
          showParameters(item);
        });

        item.addEventListener("pointermove", (event) => {
          if (!dragState || dragState.item !== item) return;
          const stageRect = getLayoutStage().getBoundingClientRect();
          const itemRect = item.getBoundingClientRect();
          const width = usesLayoutMetrics(item)
            ? (item.offsetWidth / stageRect.width) * 100
            : (itemRect.width / stageRect.width) * 100;
          const height = usesLayoutMetrics(item)
            ? (item.offsetHeight / stageRect.height) * 100
            : (itemRect.height / stageRect.height) * 100;
          const left = clamp(((event.clientX - stageRect.left - dragState.offsetX) / stageRect.width) * 100, 0, 100 - width);
          const top = clamp(((event.clientY - stageRect.top - dragState.offsetY) / stageRect.height) * 100, 0, 100 - height);
          applyParameters(item, { left, top, width });
          showParameters(item);
        });

        item.addEventListener("pointerup", () => {
          item.classList.remove("is-dragging");
          dragState = null;
        });
      });

      cameraItem.addEventListener("click", openMemoryBox);
      cameraItem.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openMemoryBox();
        }
      });
      memoryClose.addEventListener("click", closeMemoryBox);
      memoryOverlay.addEventListener("click", (event) => {
        if (event.target === memoryOverlay) closeMemoryBox();
      });
      memoryPrevious.addEventListener("click", () => showMobileMemoryPhoto(mobileMemoryIndex - 1, "previous"));
      memoryNext.addEventListener("click", () => showMobileMemoryPhoto(mobileMemoryIndex + 1, "next"));
      memoryWall.addEventListener("pointerdown", (event) => {
        if (!isMobileRoom() || event.pointerType !== "touch") return;
        memoryDidSwipe = false;
        memoryTouchStart = { x: event.clientX, y: event.clientY };
      });
      memoryWall.addEventListener("pointerup", (event) => {
        if (!memoryTouchStart || !isMobileRoom() || event.pointerType !== "touch") return;
        const moveX = event.clientX - memoryTouchStart.x;
        const moveY = event.clientY - memoryTouchStart.y;
        memoryTouchStart = null;
        if (Math.abs(moveX) < 42 || Math.abs(moveX) <= Math.abs(moveY)) return;
        memoryDidSwipe = true;
        showMobileMemoryPhoto(mobileMemoryIndex + (moveX < 0 ? 1 : -1), moveX < 0 ? "next" : "previous");
        window.setTimeout(() => { memoryDidSwipe = false; }, 0);
      });
      memoryWall.addEventListener("pointercancel", () => { memoryTouchStart = null; });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && memoryOverlay.classList.contains("is-open")) closeMemoryBox();
        if (event.key === "Escape" && notebookOverlay.classList.contains("is-open")) closeNotebook();
        if (event.key === "Escape" && cakeOverlay.classList.contains("is-open")) closeCakeCelebration();
      });

      notebookItem.addEventListener("click", openNotebook);
      notebookItem.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openNotebook();
        }
      });
      notebookClose.addEventListener("click", closeNotebook);
      notebookOverlay.addEventListener("click", (event) => {
        if (event.target === notebookOverlay) closeNotebook();
      });
      cakeItem.addEventListener("click", openCakeCelebration);
      cakeItem.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openCakeCelebration();
        }
      });
      cakeClose.addEventListener("click", closeCakeCelebration);
      cakeOverlay.addEventListener("click", (event) => {
        if (event.target === cakeOverlay) closeCakeCelebration();
      });
      cakeStage.addEventListener("click", blowCakeCandle);
      cakeStage.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          blowCakeCandle();
        }
      });
      mimiItem.addEventListener("click", () => celebrateCharacter(mimiItem, "🎉 +1", "Happy birthday ✨"));
      dogItem.addEventListener("click", () => celebrateCharacter(dogItem, "🐾 +1", "汪！过生日 🐶"));
      [mimiItem, dogItem].forEach((item) => {
        item.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            if (item === mimiItem) celebrateCharacter(mimiItem, "🎉 +1", "Happy birthday ✨");
            if (item === dogItem) celebrateCharacter(dogItem, "🐾 +1", "汪！过生日 🐶");
          }
        });
      });
      messageForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const name = messageName.value.trim();
        const text = messageText.value.trim();
        if (editingMessageIndex === null) {
          addMessageCard(name, text);
        } else {
          messages[editingMessageIndex] = { ...messages[editingMessageIndex], name, text };
          saveMessages();
          renderMessagePage();
          resetMessageEditor();
        }
        if (editingMessageIndex === null) messageForm.reset();
        messageName.focus();
      });
      messageCards.addEventListener("click", (event) => {
        const action = event.target.closest("[data-message-action]");
        if (!action) return;
        const index = Number(action.dataset.messageIndex);
        if (action.dataset.messageAction === "edit") beginMessageEdit(index);
        if (action.dataset.messageAction === "remove") removeMessage(index);
      });
      messagePrevious.addEventListener("click", () => {
        messagePage -= 1;
        renderMessagePage();
      });
      messageNext.addEventListener("click", () => {
        messagePage += 1;
        renderMessagePage();
      });

      roomStage.addEventListener("wheel", (event) => {
        if (!editing) return;
        const item = event.target.closest(".room-item");
        if (!item) return;
        event.preventDefault();
        const parameters = getParameters(item);
        const scale = event.deltaY < 0 ? 1.1 : 0.9;
        const baseWidth = Number.isFinite(parameters.width) && parameters.width > 0
          ? parameters.width
          : fallbackWidth(item);
        const maximumWidth = isMobileRoom() ? 75 : 30;
        const width = clamp(baseWidth * scale, 3, maximumWidth);
        applyParameters(item, { left: parameters.left, top: parameters.top, width });
        showParameters(item);
      }, { passive: false });

      window.addEventListener("load", () => {
        if (showEditorTools) {
          editToggle.hidden = false;
          saveLayout.hidden = false;
        }
        try {
          const savedLayout = JSON.parse(localStorage.getItem(getLayoutStorageKey()));
          applyLayout(isValidLayout(savedLayout) ? savedLayout : getDefaultRoomLayout());
        } catch {
          applyLayout(getDefaultRoomLayout());
        }
        try {
          const savedMessages = JSON.parse(localStorage.getItem(messageStorageKey));
          if (Array.isArray(savedMessages)) messages = savedMessages;
        } catch {
          localStorage.removeItem(messageStorageKey);
        }
        renderMessagePage();
      });
    </script>
  </body>
</html>
