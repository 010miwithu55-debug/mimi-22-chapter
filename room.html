<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mimi's 22 Chapter birthday room" />
    <title>Mimi's 22 Chapter — Room</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      :root {
        --flame-top: 1%;
        --flame-left: 46%;
      }

      .room-screen {
        isolation: isolate;
      }

      .room-item {
        position: absolute;
        display: block;
        height: auto;
        user-select: none;
        pointer-events: auto;
        transition: transform 180ms ease;
      }

      .room-screen:not(.is-editing) .mimi:hover,
      .room-screen:not(.is-editing) .dog:hover,
      .room-screen:not(.is-editing) .cake:hover { transform: scale(1.07); }

      .room-screen:not(.is-editing) .camera:hover { transform: rotate(-6deg) scale(1.07); }
      .room-screen:not(.is-editing) .notebook:hover { transform: rotate(7deg) scale(1.07); }

      .hover-tooltip {
        position: fixed;
        z-index: 20;
        max-width: min(15rem, 78vw);
        padding: 0.55rem 0.75rem;
        color: #8d4263;
        font: 700 0.9rem/1.35 "Marker Felt", "Bradley Hand", "Comic Sans MS", cursive;
        text-align: center;
        background: #fff6fa;
        border: 2px dashed #de91b0;
        border-radius: 10px 13px 9px 12px;
        box-shadow: 3px 4px 0 rgb(181 79 123 / 20%);
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, calc(-100% - 12px)) scale(0.82) rotate(-1.5deg);
        transition: opacity 150ms ease, transform 180ms ease;
      }

      .hover-tooltip.is-visible {
        opacity: 1;
        transform: translate(-50%, calc(-100% - 12px)) scale(1) rotate(-1.5deg);
      }

      .camera-flash {
        position: fixed;
        inset: 0;
        z-index: 29;
        pointer-events: none;
        background: #fff;
        opacity: 0;
      }

      .camera-flash.is-flashing { animation: camera-flash 420ms ease-out; }

      .memory-overlay {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: grid;
        place-items: center;
        padding: clamp(1rem, 3vw, 2.5rem);
        overflow: hidden;
        background: rgb(105 47 76 / 42%);
        opacity: 0;
        visibility: hidden;
        transition: opacity 220ms ease, visibility 220ms ease;
      }

      .memory-overlay.is-open {
        opacity: 1;
        visibility: visible;
      }

      .notebook-overlay {
        position: fixed;
        inset: 0;
        z-index: 31;
        display: grid;
        place-items: center;
        padding: 1rem;
        overflow: hidden;
        background: rgb(105 47 76 / 42%);
        opacity: 0;
        visibility: hidden;
        transition: opacity 240ms ease, visibility 240ms ease;
      }

      .notebook-overlay.is-open {
        opacity: 1;
        visibility: visible;
      }

      .cake-overlay {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 32;
        display: grid;
        place-items: center;
        padding: 1rem;
        overflow: hidden;
        background: rgb(105 47 76 / 46%);
        opacity: 0;
        visibility: hidden;
        transition: opacity 240ms ease, visibility 240ms ease;
      }

      .cake-overlay.is-open {
        opacity: 1;
        visibility: visible;
      }

      .cake-celebration {
        position: relative;
        justify-self: center;
        align-self: center;
        width: min(90vw, 34rem);
        margin: 0;
        padding: clamp(1.5rem, 4vw, 2.7rem);
        text-align: center;
        background: #fff0f6;
        border: 2px dashed #e79ab9;
        border-radius: 24px 30px 22px 28px;
        box-shadow: 8px 10px 0 rgb(120 46 80 / 18%);
        transform-origin: center;
        transform: scale(0.94) rotate(0.8deg);
        transition: transform 280ms cubic-bezier(.2, .85, .25, 1.12);
      }

      .cake-overlay.is-open .cake-celebration { transform: scale(1) rotate(0.8deg); }

      .cake-title {
        margin: 0;
        color: #ab4c77;
        font: 800 clamp(1.8rem, 5vw, 3rem)/1 "Marker Felt", "Bradley Hand", "Comic Sans MS", cursive;
      }

      .cake-subtitle {
        margin: 0.45rem 0 1rem;
        color: #a67087;
        font: italic 0.95rem/1.4 Georgia, serif;
      }

      .cake-close {
        position: absolute;
        top: 0.8rem;
        right: 0.9rem;
        width: 2.2rem;
        height: 2.2rem;
        color: #ba638b;
        font: 700 1.25rem/1 sans-serif;
        cursor: pointer;
        background: #fff9fc;
        border: 2px solid #e6a6c1;
        border-radius: 50%;
      }

      .cake-stage {
        position: relative;
        width: min(72vw, 20rem);
        margin: 0 auto;
        cursor: pointer;
      }

      .cake-stage > img { display: block; width: 100%; height: auto; }

      .cake-flame {
        position: absolute;
        top: var(--flame-top);
        left: var(--flame-left);
        width: 7%;
        aspect-ratio: 0.62;
        background: linear-gradient(#fff7a6, #ff9b62 65%, #f3708d);
        border-radius: 60% 60% 65% 65%;
        box-shadow: 0 0 15px #ffd77b;
        transform-origin: 50% 100%;
        animation: flame-flicker 700ms ease-in-out infinite alternate;
      }

      .cake-candle-mask {
        position: absolute;
        top: calc(var(--flame-top) - 1%);
        left: calc(var(--flame-left) - 1.5%);
        width: 10%;
        height: 10%;
        background: #fff0f6;
        border-radius: 50% 50% 35% 35%;
        opacity: 0;
      }

      .cake-smoke {
        position: absolute;
        top: var(--flame-top);
        left: var(--flame-left);
        width: 5%;
        aspect-ratio: 1;
        background: rgb(205 196 207 / 72%);
        border-radius: 50%;
        opacity: 0;
      }

      .cake-star {
        position: absolute;
        top: 20%;
        left: 50%;
        color: #f2b956;
        font-size: clamp(1rem, 4vw, 1.8rem);
        opacity: 0;
        pointer-events: none;
      }

      .cake-stage.is-blown .cake-flame { opacity: 0; animation: none; }
      .cake-stage.is-blown .cake-candle-mask { opacity: 1; }
      .cake-stage.is-blown .cake-smoke { animation: smoke-rise 950ms ease-out forwards; }
      .cake-stage.is-blown .cake-star { animation: star-burst 800ms ease-out forwards; }
      .cake-stage.is-blown .cake-star:nth-of-type(4) { animation-delay: 80ms; }
      .cake-stage.is-blown .cake-star:nth-of-type(5) { animation-delay: 150ms; }

      .cake-star--left { --x: -6rem; --y: -3rem; }
      .cake-star--right { --x: 5rem; --y: -3.5rem; }
      .cake-star--top { --x: 0.5rem; --y: -5rem; }

      .cake-result {
        margin: 0.5rem 0 0;
        color: #bf5c88;
        font: 800 clamp(1.05rem, 3.2vw, 1.55rem)/1.25 "Marker Felt", "Bradley Hand", "Comic Sans MS", cursive;
        opacity: 0;
        transform: translateY(8px) scale(0.95);
        transition: opacity 260ms ease, transform 260ms ease;
      }

      .cake-celebration.is-finished .cake-result { opacity: 1; transform: translateY(0) scale(1); }

      @keyframes flame-flicker {
        from { transform: rotate(-5deg) scale(0.92, 1.05); }
        to { transform: rotate(5deg) scale(1.05, 0.93); }
      }

      @keyframes smoke-rise {
        0% { opacity: 0; transform: translate(0, 0) scale(0.5); }
        20% { opacity: 0.75; }
        100% { opacity: 0; transform: translate(1rem, -4rem) scale(2.2); }
      }

      @keyframes star-burst {
        0% { opacity: 0; transform: translate(0, 0) scale(0.4) rotate(0); }
        30% { opacity: 1; }
        100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(1.15) rotate(100deg); }
      }

      .notebook-page {
        position: relative;
        width: min(82vw, 42rem);
        height: min(82svh, 42rem);
        padding: clamp(2.5rem, 7vw, 4.5rem) clamp(1.4rem, 6vw, 4rem) 1.5rem;
        text-align: center;
        background: url("assets/backgrounds/melody-paper.png") center / contain no-repeat;
        transform: scale(0.94) rotate(-1deg);
        transition: transform 300ms cubic-bezier(.2, .85, .25, 1.12);
      }

      .notebook-overlay.is-open .notebook-page { transform: scale(1) rotate(-1deg); }

      .notebook-title {
        margin: 0;
        color: #c66f9c;
        font: 800 clamp(1.35rem, 3.5vw, 2.15rem)/1.1 "Marker Felt", "Bradley Hand", "Comic Sans MS", cursive;
      }

      .notebook-subtitle {
        margin: 0.35rem 0 1rem;
        color: #aa7892;
        font: italic 0.95rem/1.4 Georgia, serif;
      }

      .notebook-close {
        position: absolute;
        top: 1.2rem;
        right: 1rem;
        width: 2.2rem;
        height: 2.2rem;
        color: #bc668e;
        font: 700 1.25rem/1 sans-serif;
        cursor: pointer;
        background: #fff9fc;
        border: 2px solid #e6a6c1;
        border-radius: 50%;
        box-shadow: 2px 3px 0 rgb(169 71 115 / 16%);
      }

      .message-form {
        display: grid;
        gap: 0.55rem;
        width: min(100%, 28rem);
        margin: 0 auto;
      }

      .message-form input,
      .message-form textarea {
        width: 100%;
        color: #8f5870;
        font: 0.95rem/1.4 "Marker Felt", "Bradley Hand", "Comic Sans MS", cursive;
        background: rgb(255 255 255 / 64%);
        border: 1px dashed #df9eb8;
        border-radius: 8px 11px 7px 10px;
        outline: none;
      }

      .message-form input { padding: 0.55rem 0.75rem; }
      .message-form textarea { min-height: 4.6rem; padding: 0.6rem 0.75rem; resize: none; }
      .message-form input:focus,
      .message-form textarea:focus { border-color: #c86b96; box-shadow: 0 0 0 3px rgb(239 181 205 / 34%); }

      .message-submit {
        justify-self: center;
        padding: 0.6rem 1rem;
        color: #a74d75;
        font: 700 1rem "Marker Felt", "Bradley Hand", "Comic Sans MS", cursive;
        cursor: pointer;
        background: #ffe3ef;
        border: 2px dashed #dc8cad;
        border-radius: 7px 11px 6px 10px;
        box-shadow: 2px 3px 0 rgb(173 77 118 / 19%);
      }

      .message-cards {
        position: relative;
        height: clamp(10rem, 30vh, 15rem);
        margin-top: 0.6rem;
        overflow: hidden;
      }

      .message-card {
        position: absolute;
        width: min(22%, 6.3rem);
        aspect-ratio: 1;
        color: #715b4e;
        filter: drop-shadow(3px 5px 5px rgb(126 66 83 / 22%));
        animation: message-card-appear 260ms ease-out both;
      }

      .note-card-background {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
      }

      .note-content {
        position: absolute;
        inset: 24% 18% 27%;
        z-index: 1;
        display: grid;
        align-content: center;
        gap: 0.25rem;
        overflow: hidden;
        text-align: center;
      }

      .message-card-name { margin: 0; color: #bd668d; font: 700 clamp(0.38rem, 0.95vw, 0.55rem) "Marker Felt", "Bradley Hand", "Comic Sans MS", cursive; overflow-wrap: anywhere; }
      .message-card-text { margin: 0; font: clamp(0.34rem, 0.85vw, 0.5rem)/1.2 "Marker Felt", "Bradley Hand", "Comic Sans MS", cursive; overflow-wrap: anywhere; }

      .message-actions {
        position: absolute;
        top: -0.55rem;
        right: -0.45rem;
        z-index: 3;
        display: flex;
        gap: 0.2rem;
        opacity: 0;
        transform: translateY(3px) scale(0.88);
        transition: opacity 160ms ease, transform 160ms ease;
      }

      .message-card:hover .message-actions,
      .message-card:focus-within .message-actions {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      .message-actions button {
        padding: 0.22rem 0.35rem;
        color: #a64f77;
        font: 700 0.52rem "Marker Felt", "Bradley Hand", "Comic Sans MS", cursive;
        white-space: nowrap;
        cursor: pointer;
        background: #fff8fb;
        border: 1px dashed #df9eb8;
        border-radius: 5px;
        box-shadow: 1px 2px 0 rgb(181 79 123 / 16%);
      }

      .message-pagination {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.65rem;
        margin-top: 0.25rem;
        color: #bd668d;
        font: 700 0.7rem "Marker Felt", "Bradley Hand", "Comic Sans MS", cursive;
      }

      .message-pagination button {
        width: 1.65rem;
        height: 1.4rem;
        color: #b65d86;
        cursor: pointer;
        background: rgb(255 249 252 / 70%);
        border: 1px dashed #df9eb8;
        border-radius: 6px;
      }

      .message-pagination button:disabled { cursor: default; opacity: 0.4; }

      @keyframes message-card-appear {
        from { opacity: 0; transform: translateY(8px) scale(0.9) rotate(var(--card-rotation)); }
        to { opacity: 1; transform: translateY(0) scale(1) rotate(var(--card-rotation)); }
      }

      .memory-box {
        position: relative;
        width: min(100%, 68rem);
        height: min(88svh, calc(100svh - 5rem), 48rem);
        padding: clamp(1.1rem, 3vw, 2.25rem);
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        overflow: hidden;
        background: #ffeef4;
        border: 2px dashed #e59ab8;
        border-radius: 20px 27px 18px 24px;
        box-shadow: 8px 10px 0 rgb(120 46 80 / 18%);
        transform: scale(0.94) rotate(-0.8deg);
        transition: transform 260ms cubic-bezier(.2, .85, .25, 1.12);
      }

      .memory-overlay.is-open .memory-box { transform: scale(1) rotate(-0.8deg); }

      .memory-title {
        margin: 0;
        color: #a94773;
        font: 800 clamp(1.45rem, 4vw, 2.5rem)/1.1 "Marker Felt", "Bradley Hand", "Comic Sans MS", cursive;
        text-align: center;
      }

      .memory-subtitle {
        margin: 0.45rem 0 1rem;
        color: #a86c83;
        font: italic 1rem/1.4 Georgia, serif;
        text-align: center;
      }

      .memory-close {
        position: absolute;
        top: 0.8rem;
        right: 0.9rem;
        width: 2.25rem;
        height: 2.25rem;
        color: #a94773;
        font: 700 1.25rem/1 sans-serif;
        cursor: pointer;
        background: #fff9fb;
        border: 2px solid #e59ab8;
        border-radius: 50%;
        box-shadow: 2px 3px 0 rgb(169 71 115 / 20%);
      }

      .memory-wall {
        position: relative;
        min-height: 0;
        overflow: hidden;
      }

      .memory-photo {
        position: absolute;
        display: block;
        z-index: 1;
        height: auto;
        object-fit: contain;
        filter: drop-shadow(3px 6px 5px rgb(116 50 79 / 22%));
        transform-origin: center;
        cursor: zoom-in;
        transition: transform 220ms ease, filter 220ms ease;
      }

      .memory-photo-note {
        position: absolute;
        z-index: 4;
        max-width: 12rem;
        padding: 0.45rem 0.65rem;
        color: #98506e;
        font: 700 0.8rem/1.3 "Marker Felt", "Bradley Hand", "Comic Sans MS", cursive;
        text-align: center;
        background: #fff7fa;
        border: 2px dashed #e39ab7;
        border-radius: 9px 12px 8px 11px;
        box-shadow: 2px 3px 0 rgb(181 79 123 / 18%);
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, calc(-100% - 8px)) scale(0.85) rotate(-1.5deg);
        transition: opacity 150ms ease, transform 180ms ease;
      }

      .memory-photo-note.is-visible {
        opacity: 1;
        transform: translate(-50%, calc(-100% - 8px)) scale(1) rotate(-1.5deg);
      }

      .memory-photo-note.is-below {
        transform: translate(-50%, 8px) scale(0.85) rotate(-1.5deg);
      }

      .memory-photo-note.is-below.is-visible {
        transform: translate(-50%, 8px) scale(1) rotate(-1.5deg);
      }

      .memory-sticker {
        position: absolute;
        z-index: 0;
        height: auto;
        pointer-events: none;
        filter: drop-shadow(2px 3px 2px rgb(132 61 91 / 16%));
      }

      @keyframes camera-flash {
        0% { opacity: 0; }
        18% { opacity: 0.92; }
        100% { opacity: 0; }
      }

      @media (max-width: 650px) {
        .memory-box { height: min(92svh, calc(100svh - 2rem), 48rem); padding: 1rem; }
        .memory-title { padding-inline: 2rem; }
        .memory-subtitle { margin-bottom: 0.6rem; }
      }

      .mimi-character {
        aspect-ratio: 362 / 454;
      }

      .mimi-character img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center bottom;
        pointer-events: none;
      }

      .mimi-character .mimi-close {
        opacity: 0;
        animation: mimi-blink 5s steps(1, end) infinite;
      }

      .mimi-character .mimi-open {
        animation: mimi-open 5s steps(1, end) infinite;
      }

      .dog-character {
        aspect-ratio: 812 / 726;
      }

      .dog-character img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center bottom;
        pointer-events: none;
      }

      .dog-character .dog-close { opacity: 0; }
      .dog-character.is-blinking .dog-open { opacity: 0; }
      .dog-character.is-blinking .dog-close { opacity: 1; }

      .edit-toggle {
        position: fixed;
        top: 2%;
        right: 2%;
        z-index: 10;
        padding: 0.65em 0.9em;
        color: #8d4263;
        font: 700 0.95rem "Marker Felt", "Bradley Hand", "Comic Sans MS", cursive;
        background: #fff4f8;
        border: 1px solid #e8a1bd;
        border-radius: 8px 11px 7px 10px;
        box-shadow: 2px 3px 0 rgb(163 74 112 / 22%);
        cursor: pointer;
      }

      .save-layout {
        position: fixed;
        top: 2%;
        right: 12%;
        z-index: 10;
        padding: 0.65em 0.9em;
        color: #8d4263;
        font: 700 0.95rem "Marker Felt", "Bradley Hand", "Comic Sans MS", cursive;
        background: #fff4f8;
        border: 1px solid #e8a1bd;
        border-radius: 8px 11px 7px 10px;
        box-shadow: 2px 3px 0 rgb(163 74 112 / 22%);
        cursor: pointer;
      }

      .editor-readout {
        position: fixed;
        bottom: 2%;
        left: 2%;
        z-index: 10;
        min-width: 12rem;
        margin: 0;
        padding: 0.8rem 1rem;
        color: #75445a;
        font: 0.9rem/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-line;
        background: rgb(255 249 251 / 90%);
        border: 1px dashed #dfa0b8;
        border-radius: 7px;
        box-shadow: 2px 3px 0 rgb(163 74 112 / 16%);
      }

      .room-screen.is-editing [data-editable] {
        pointer-events: auto;
        cursor: grab;
        outline: 1px dashed rgb(183 75 119 / 58%);
        outline-offset: 3px;
        touch-action: none;
      }

      .room-screen.is-editing [data-editable]:hover { outline-color: #bd4d79; }
      .room-screen.is-editing [data-editable].is-dragging { cursor: grabbing; }

      /* All dimensions and anchors use the room stage's percentage-based coordinate system. */
      .mimi { width: 9%; left: 30%; bottom: 8%; z-index: 2; }
      .dog { width: 8%; left: 42%; bottom: 8%; z-index: 3; }
      .cake { width: 11%; left: 52%; bottom: 15%; z-index: 4; }
      .camera { width: 5%; left: 15%; bottom: 42%; z-index: 2; transform: rotate(-6deg); }
      .notebook {
        display: block;
        width: 6%;
        left: 75%;
        bottom: 30%;
        z-index: 5;
        visibility: visible;
        opacity: 1;
        transform: rotate(7deg);
      }

      @keyframes mimi-blink {
        0%, 93%, 97%, 100% { opacity: 0; }
        94%, 96% { opacity: 1; }
      }

      @keyframes mimi-open {
        0%, 93%, 97%, 100% { opacity: 1; }
        94%, 96% { opacity: 0; }
      }
    </style>
  </head>
  <body>
    <main class="screen room-screen" aria-label="Mimi's birthday room">
      <div class="room-item mimi mimi-character" data-editable data-layout-key="mimi" data-tooltip="今天是特别的日子🥳🎉" aria-label="Mimi">
        <img class="mimi-open" src="assets/characters/mimi-open.png" alt="" draggable="false" />
        <img class="mimi-close" src="assets/characters/mimi-close.png" alt="" draggable="false" />
      </div>
      <div class="room-item dog dog-character" data-editable data-layout-key="dog" data-tooltip="汪汪！🐶" aria-label="A small dog">
        <img class="dog-open" src="assets/objects/dog-open.png" alt="" draggable="false" />
        <img class="dog-close" src="assets/objects/dog-close.png" alt="" draggable="false" />
      </div>
      <img class="room-item cake" data-editable data-layout-key="cake" data-tooltip="一起吹灭蜡烛吧 🎂" src="assets/objects/cake.png" alt="Make a birthday wish" draggable="false" role="button" tabindex="0" />
      <img class="room-item notebook" id="notebook" data-editable data-layout-key="notebook" data-tooltip="谢谢你来到我的22岁💌" src="assets/objects/notebook.png" alt="Open Mimi's guestbook" draggable="false" role="button" tabindex="0" />
      <img class="room-item camera" data-editable data-layout-key="camera" data-tooltip="打开我的回忆铁盒 📷" src="assets/objects/camera.png" alt="Open Mimi's memory box" draggable="false" role="button" tabindex="0" />
    </main>
    <button class="edit-toggle" id="edit-toggle" type="button" aria-pressed="false">Edit room</button>
    <button class="save-layout" id="save-layout" type="button">Save layout</button>
    <aside class="editor-readout" id="editor-readout" hidden aria-live="polite"></aside>
    <aside class="hover-tooltip" id="hover-tooltip" role="status" aria-live="polite"></aside>
    <div class="camera-flash" id="camera-flash" aria-hidden="true"></div>
    <section class="memory-overlay" id="memory-overlay" aria-hidden="true" aria-labelledby="memory-title">
      <div class="memory-box" role="dialog" aria-modal="true" aria-labelledby="memory-title">
        <button class="memory-close" id="memory-close" type="button" aria-label="Close memories">×</button>
        <h1 class="memory-title" id="memory-title">米米的22岁回忆铁盒 📷</h1>
        <p class="memory-subtitle">little moments I want to keep ✦</p>
        <div class="memory-wall">
          <img class="memory-photo" data-memory-note="😭不想长大" src="assets/photos/photo1.png" alt="Mimi memory 1" />
          <img class="memory-photo" data-memory-note="想念的时刻 ♡" src="assets/photos/photo2.png" alt="Mimi memory 2" />
          <img class="memory-photo" data-memory-note="把今天夹进日记里" src="assets/photos/photo3.png" alt="Mimi memory 3" />
          <img class="memory-photo" data-memory-note="22岁也要闪闪发光" src="assets/photos/photo4.png" alt="Mimi memory 4" />
          <img class="memory-photo" data-memory-note="这一页想一直留着" src="assets/photos/photo5.png" alt="Mimi memory 5" />
          <img class="memory-photo" data-memory-note="再看一次还是会笑" src="assets/photos/photo6.png" alt="Mimi memory 6" />
          <div id="memory-stickers" aria-hidden="true"></div>
          <aside class="memory-photo-note" id="memory-photo-note" aria-live="polite"></aside>
        </div>
      </div>
    </section>
    <section class="notebook-overlay" id="notebook-overlay" aria-hidden="true" aria-labelledby="notebook-title">
      <div class="notebook-page" role="dialog" aria-modal="true" aria-labelledby="notebook-title">
        <button class="notebook-close" id="notebook-close" type="button" aria-label="Close guestbook">×</button>
        <h1 class="notebook-title" id="notebook-title">谢谢你来到我的22岁 💌</h1>
        <p class="notebook-subtitle">leave a little note for me</p>
        <form class="message-form" id="message-form">
          <input id="message-name" name="name" type="text" placeholder="Your name ✦✦" required />
          <textarea id="message-text" name="message" placeholder="Leave a little note ✦" required></textarea>
          <button class="message-submit" id="message-submit" type="submit">放进我的22岁 ✦</button>
        </form>
        <div class="message-cards" id="message-cards" aria-live="polite"></div>
        <div class="message-pagination" aria-label="Message pages">
          <button id="message-previous" type="button" aria-label="Previous message page">←</button>
          <span id="message-page">1 / 1</span>
          <button id="message-next" type="button" aria-label="Next message page">→</button>
        </div>
      </div>
    </section>
    <section class="cake-overlay" id="cake-overlay" aria-hidden="true" aria-labelledby="cake-title">
      <div class="cake-celebration" id="cake-celebration" role="dialog" aria-modal="true" aria-labelledby="cake-title">
        <button class="cake-close" id="cake-close" type="button" aria-label="Close birthday wish">×</button>
        <h1 class="cake-title" id="cake-title">Make a wish ✨</h1>
        <p class="cake-subtitle">close your eyes and make a wish</p>
        <div class="cake-stage" id="cake-stage" role="button" tabindex="0" aria-label="Blow out the candle">
          <img src="assets/objects/cake.png" alt="Birthday cake" />
          <span class="cake-flame"></span>
          <span class="cake-candle-mask"></span>
          <span class="cake-smoke"></span>
          <span class="cake-star cake-star--left">✦</span>
          <span class="cake-star cake-star--right">✦</span>
          <span class="cake-star cake-star--top">✦</span>
        </div>
        <p class="cake-result">Happy 22nd Birthday, Mimi! 🎉</p>
      </div>
    </section>

    <script>
      const roomStage = document.querySelector(".room-screen");
      const roomItems = [...document.querySelectorAll("[data-editable]")];
      const editToggle = document.querySelector("#edit-toggle");
      const saveLayout = document.querySelector("#save-layout");
      const readout = document.querySelector("#editor-readout");
      const hoverTooltip = document.querySelector("#hover-tooltip");
      const dogCharacter = document.querySelector(".dog-character");
      const cameraItem = document.querySelector(".camera");
      const cameraFlash = document.querySelector("#camera-flash");
      const memoryOverlay = document.querySelector("#memory-overlay");
      const memoryClose = document.querySelector("#memory-close");
      const notebookItem = document.querySelector(".notebook");
      const notebookOverlay = document.querySelector("#notebook-overlay");
      const notebookClose = document.querySelector("#notebook-close");
      const messageForm = document.querySelector("#message-form");
      const messageName = document.querySelector("#message-name");
      const messageText = document.querySelector("#message-text");
      const messageCards = document.querySelector("#message-cards");
      const messagePrevious = document.querySelector("#message-previous");
      const messageNext = document.querySelector("#message-next");
      const messagePageLabel = document.querySelector("#message-page");
      const messageSubmit = document.querySelector("#message-submit");
      const cakeItem = document.querySelector(".cake");
      const cakeOverlay = document.querySelector("#cake-overlay");
      const cakeCelebration = document.querySelector("#cake-celebration");
      const cakeClose = document.querySelector("#cake-close");
      const cakeStage = document.querySelector("#cake-stage");
      const memoryWall = document.querySelector(".memory-wall");
      const memoryPhotos = [...document.querySelectorAll(".memory-photo")];
      const memoryStickers = document.querySelector("#memory-stickers");
      const memoryPhotoNote = document.querySelector("#memory-photo-note");
      const layoutStorageKey = "mimi-22-room-layout";
      const messageStorageKey = "mimi-22-notebook-messages";
      let editing = false;
      let dragState = null;
      let isNormalized = false;
      let messages = [];
      let messagePage = 0;
      let editingMessageIndex = null;

      const clamp = (value, minimum, maximum) => Math.min(Math.max(value, minimum), maximum);
      const usesLayoutMetrics = (item) => item.classList.contains("camera") || item.classList.contains("notebook");
      const fallbackWidth = (item) => item.classList.contains("camera") ? 5 : 6;

      const randomBetween = (minimum, maximum) => minimum + Math.random() * (maximum - minimum);
      const messagesPerPage = 5;
      const messageSlots = [
        { left: 5, top: 5 }, { left: 39, top: 14 }, { left: 73, top: 5 },
        { left: 22, top: 51 }, { left: 57, top: 56 },
      ];
      const shuffle = (items) => {
        const shuffledItems = [...items];
        for (let index = shuffledItems.length - 1; index > 0; index -= 1) {
          const randomIndex = Math.floor(Math.random() * (index + 1));
          [shuffledItems[index], shuffledItems[randomIndex]] = [shuffledItems[randomIndex], shuffledItems[index]];
        }
        return shuffledItems;
      };
      const photoZones = [
        { left: 3, top: 5, width: 27, height: 41 },
        { left: 35, top: 3, width: 28, height: 43 },
        { left: 68, top: 6, width: 28, height: 40 },
        { left: 4, top: 53, width: 28, height: 41 },
        { left: 36, top: 51, width: 27, height: 44 },
        { left: 68, top: 54, width: 27, height: 40 },
      ];
      const stickerAssets = [
        ["assets/stickers/star-yellow.PNG", 5],
        ["assets/stickers/sparkle-yellow.PNG", 5],
        ["assets/stickers/bow-blue.PNG", 2],
        ["assets/stickers/clover-green.PNG", 2],
      ];
      const stickerAnchors = [
        { left: 1, top: 2 }, { left: 31, top: 2 }, { left: 65, top: 2 }, { left: 95, top: 3 },
        { left: 1, top: 48 }, { left: 33, top: 48 }, { left: 65, top: 48 }, { left: 95, top: 48 },
        { left: 2, top: 93 }, { left: 32, top: 93 }, { left: 65, top: 93 }, { left: 95, top: 93 },
        { left: 31, top: 25 }, { left: 65, top: 74 },
      ];

      function createMemoryStickers() {
        stickerAssets.forEach(([source, count]) => {
          for (let index = 0; index < count; index += 1) {
            const sticker = document.createElement("img");
            sticker.className = "memory-sticker";
            sticker.src = source;
            sticker.alt = "";
            memoryStickers.append(sticker);
          }
        });
      }

      function scatterMemoryPhotos() {
        const wallRect = memoryWall.getBoundingClientRect();
        if (!wallRect.width || !wallRect.height) return;
        const shuffledPhotos = shuffle(memoryPhotos);

        shuffledPhotos.forEach((photo, index) => {
          const zone = photoZones[index];
          const scale = randomBetween(0.9, 1.05);
          const rotation = randomBetween(-8, 8);
          const zoneWidth = wallRect.width * (zone.width / 100);
          const zoneHeight = wallRect.height * (zone.height / 100);
          const insetX = zoneWidth * 0.08;
          const insetY = zoneHeight * 0.08;
          const ratio = photo.naturalWidth / photo.naturalHeight || 0.75;
          const baseWidth = Math.min(
            (zoneWidth - insetX * 2) / 1.05,
            ((zoneHeight - insetY * 2) * ratio) / 1.05,
          );
          const baseHeight = baseWidth / ratio;
          const visualWidth = baseWidth * scale;
          const visualHeight = baseHeight * scale;
          const zoneLeft = wallRect.width * (zone.left / 100);
          const zoneTop = wallRect.height * (zone.top / 100);
          const centerX = randomBetween(
            zoneLeft + insetX + visualWidth / 2,
            zoneLeft + zoneWidth - insetX - visualWidth / 2,
          );
          const centerY = randomBetween(
            zoneTop + insetY + visualHeight / 2,
            zoneTop + zoneHeight - insetY - visualHeight / 2,
          );

          photo.style.width = `${baseWidth}px`;
          photo.style.left = `${centerX - baseWidth / 2}px`;
          photo.style.top = `${centerY - baseHeight / 2}px`;
          photo.dataset.baseTransform = `rotate(${rotation}deg) scale(${scale})`;
          photo.dataset.baseRotation = rotation;
          photo.dataset.baseScale = scale;
          photo.style.transform = photo.dataset.baseTransform;
          photo.style.zIndex = 1;
          memoryWall.insertBefore(photo, memoryStickers);
        });

        [...memoryStickers.children].forEach((sticker, index) => {
          const anchor = stickerAnchors[index % stickerAnchors.length];
          sticker.style.width = `${randomBetween(2.5, 4.5)}%`;
          sticker.style.left = `${anchor.left + randomBetween(-1.2, 1.2)}%`;
          sticker.style.top = `${anchor.top + randomBetween(-1.2, 1.2)}%`;
          sticker.style.transform = `rotate(${randomBetween(-25, 25)}deg)`;
        });
      }

      createMemoryStickers();

      function showMemoryPhotoNote(photo) {
        const wallRect = memoryWall.getBoundingClientRect();
        const photoRect = photo.getBoundingClientRect();
        const isNearTop = photoRect.top - wallRect.top < 52;
        memoryPhotoNote.textContent = photo.dataset.memoryNote;
        memoryPhotoNote.style.left = `${photoRect.left - wallRect.left + photoRect.width / 2}px`;
        memoryPhotoNote.style.top = `${isNearTop ? photoRect.bottom - wallRect.top : photoRect.top - wallRect.top}px`;
        memoryPhotoNote.classList.toggle("is-below", isNearTop);
        memoryPhotoNote.classList.add("is-visible");
      }

      function hideMemoryPhotoNote() {
        memoryPhotoNote.classList.remove("is-visible");
      }

      memoryPhotos.forEach((photo) => {
        photo.addEventListener("pointerenter", () => {
          const hoverScale = Math.min(Number(photo.dataset.baseScale) + 0.04, 1.05);
          photo.style.zIndex = 3;
          photo.style.filter = "drop-shadow(5px 10px 9px rgb(116 50 79 / 35%))";
          photo.style.transform = `rotate(${photo.dataset.baseRotation}deg) translateY(-8px) scale(${hoverScale})`;
          showMemoryPhotoNote(photo);
        });
        photo.addEventListener("pointerleave", () => {
          photo.style.zIndex = 1;
          photo.style.filter = "";
          photo.style.transform = photo.dataset.baseTransform;
          hideMemoryPhotoNote();
        });
      });

      function scheduleDogBlink() {
        const delay = 3000 + Math.random() * 3000;
        window.setTimeout(() => {
          dogCharacter.classList.add("is-blinking");
          window.setTimeout(() => {
            dogCharacter.classList.remove("is-blinking");
            scheduleDogBlink();
          }, 200);
        }, delay);
      }

      scheduleDogBlink();

      function showHoverTooltip(item) {
        if (editing) return;
        const itemRect = item.getBoundingClientRect();
        hoverTooltip.textContent = item.dataset.tooltip;
        hoverTooltip.style.left = `${itemRect.left + itemRect.width / 2}px`;
        hoverTooltip.style.top = `${itemRect.top}px`;
        hoverTooltip.classList.add("is-visible");
      }

      function hideHoverTooltip() {
        hoverTooltip.classList.remove("is-visible");
      }

      function openMemoryBox() {
        if (editing) return;
        hideHoverTooltip();
        cameraFlash.classList.remove("is-flashing");
        void cameraFlash.offsetWidth;
        cameraFlash.classList.add("is-flashing");
        memoryOverlay.hidden = false;
        memoryOverlay.setAttribute("aria-hidden", "false");
        requestAnimationFrame(() => {
          memoryOverlay.classList.add("is-open");
          scatterMemoryPhotos();
        });
        memoryClose.focus();
      }

      function closeMemoryBox() {
        memoryOverlay.classList.remove("is-open");
        memoryOverlay.setAttribute("aria-hidden", "true");
        window.setTimeout(() => { memoryOverlay.hidden = true; }, 220);
        cameraItem.focus();
      }

      function openNotebook() {
        if (editing) return;
        hideHoverTooltip();
        notebookOverlay.hidden = false;
        notebookOverlay.setAttribute("aria-hidden", "false");
        requestAnimationFrame(() => notebookOverlay.classList.add("is-open"));
        messageName.focus();
      }

      function closeNotebook() {
        notebookOverlay.classList.remove("is-open");
        notebookOverlay.setAttribute("aria-hidden", "true");
        window.setTimeout(() => { notebookOverlay.hidden = true; }, 240);
        notebookItem.focus();
      }

      function openCakeCelebration() {
        if (editing) return;
        hideHoverTooltip();
        cakeStage.classList.remove("is-blown");
        cakeCelebration.classList.remove("is-finished");
        cakeOverlay.hidden = false;
        cakeOverlay.setAttribute("aria-hidden", "false");
        requestAnimationFrame(() => cakeOverlay.classList.add("is-open"));
        cakeStage.focus();
      }

      function closeCakeCelebration() {
        cakeOverlay.classList.remove("is-open");
        cakeOverlay.setAttribute("aria-hidden", "true");
        window.setTimeout(() => { cakeOverlay.hidden = true; }, 240);
        cakeItem.focus();
      }

      function blowCakeCandle() {
        if (cakeStage.classList.contains("is-blown")) return;
        cakeStage.classList.add("is-blown");
        window.setTimeout(() => cakeCelebration.classList.add("is-finished"), 700);
      }

      function saveMessages() {
        localStorage.setItem(messageStorageKey, JSON.stringify(messages));
      }

      function renderMessagePage() {
        const totalPages = Math.max(1, Math.ceil(messages.length / messagesPerPage));
        messagePage = clamp(messagePage, 0, totalPages - 1);
        messageCards.replaceChildren();
        const pageMessages = messages.slice(messagePage * messagesPerPage, (messagePage + 1) * messagesPerPage);

        pageMessages.forEach((message, index) => {
          const messageIndex = messagePage * messagesPerPage + index;
          const card = document.createElement("article");
          const slot = messageSlots[index];
          card.className = "message-card note-card";
          card.style.left = `${slot.left + message.offsetX}%`;
          card.style.top = `${slot.top + message.offsetY}%`;
          card.style.setProperty("--card-rotation", `${message.rotation}deg`);
          card.innerHTML = `<img class="note-card-background" src="assets/stickers/heart-note.png" alt=""><div class="note-content"><p class="message-card-name"></p><p class="message-card-text"></p></div><div class="message-actions"><button type="button" data-message-action="edit" data-message-index="${messageIndex}">Edit ✎</button><button type="button" data-message-action="remove" data-message-index="${messageIndex}">Remove ×</button></div>`;
          card.querySelector(".message-card-name").textContent = message.name;
          card.querySelector(".message-card-text").textContent = message.text;
          messageCards.append(card);
        });

        messagePageLabel.textContent = `${messagePage + 1} / ${totalPages}`;
        messagePrevious.disabled = messagePage === 0;
        messageNext.disabled = messagePage === totalPages - 1;
      }

      function addMessageCard(name, message) {
        messages.push({
          name,
          text: message,
          rotation: randomBetween(-6, 6),
          offsetX: randomBetween(-1, 1),
          offsetY: randomBetween(-1, 1),
        });
        messagePage = Math.floor((messages.length - 1) / messagesPerPage);
        saveMessages();
        renderMessagePage();
      }

      function resetMessageEditor() {
        editingMessageIndex = null;
        messageForm.reset();
        messageSubmit.textContent = "放进我的22岁 ✦";
      }

      function beginMessageEdit(index) {
        const message = messages[index];
        if (!message) return;
        editingMessageIndex = index;
        messageName.value = message.name;
        messageText.value = message.text;
        messageSubmit.textContent = "更新这张留言 ✦";
        messageName.focus();
      }

      function removeMessage(index) {
        if (!messages[index] || !window.confirm("Remove this little note? 💌")) return;
        messages.splice(index, 1);
        if (editingMessageIndex === index) resetMessageEditor();
        if (editingMessageIndex !== null && editingMessageIndex > index) editingMessageIndex -= 1;
        saveMessages();
        renderMessagePage();
      }

      function getParameters(item) {
        const stageRect = roomStage.getBoundingClientRect();
        const itemRect = item.getBoundingClientRect();
        const useLayoutSize = usesLayoutMetrics(item);
        const widthPixels = useLayoutSize ? item.offsetWidth : itemRect.width;
        const heightPixels = useLayoutSize ? item.offsetHeight : itemRect.height;
        const leftPixels = useLayoutSize ? item.offsetLeft : itemRect.left - stageRect.left;
        const topPixels = useLayoutSize ? item.offsetTop : itemRect.top - stageRect.top;
        return {
          left: (leftPixels / stageRect.width) * 100,
          top: (topPixels / stageRect.height) * 100,
          width: (widthPixels / stageRect.width) * 100,
          height: (heightPixels / stageRect.height) * 100,
          widthPixels,
        };
      }

      function applyParameters(item, parameters) {
        item.style.left = `${parameters.left}%`;
        item.style.top = `${parameters.top}%`;
        item.style.bottom = "auto";
        item.style.width = `${parameters.width}%`;
      }

      function showParameters(item) {
        const parameters = getParameters(item);
        readout.textContent = `${item.classList[1]}:\nleft: ${parameters.left.toFixed(2)}%\ntop: ${parameters.top.toFixed(2)}%\nwidth: ${parameters.widthPixels.toFixed(0)}px (${parameters.width.toFixed(2)}%)`;
      }

      function normalizeItem(item) {
        applyParameters(item, getParameters(item));
      }

      function captureLayout() {
        return Object.fromEntries(roomItems.map((item) => {
          const parameters = getParameters(item);
          return [item.dataset.layoutKey, {
            left: parameters.left,
            top: parameters.top,
            width: parameters.width,
            height: parameters.height,
          }];
        }));
      }

      function applyLayout(layout) {
        roomItems.forEach((item) => {
          const parameters = layout[item.dataset.layoutKey];
          if (!parameters || ![parameters.left, parameters.top, parameters.width].every(Number.isFinite)) return;
          applyParameters(item, parameters);
        });
        isNormalized = true;
      }

      function showSavedLayout(layout) {
        const output = Object.fromEntries(Object.entries(layout).map(([name, parameters]) => [name, {
          left: `${parameters.left.toFixed(2)}%`,
          top: `${parameters.top.toFixed(2)}%`,
          width: `${parameters.width.toFixed(2)}%`,
          height: `${parameters.height.toFixed(2)}%`,
        }]));
        readout.textContent = `Saved layout:\n${JSON.stringify(output, null, 2)}`;
        readout.hidden = false;
      }

      function setEditing(nextEditing) {
        editing = nextEditing;
        roomStage.classList.toggle("is-editing", editing);
        hideHoverTooltip();
        editToggle.textContent = editing ? "Finish editing" : "Edit room";
        editToggle.setAttribute("aria-pressed", String(editing));
        readout.hidden = !editing;

        if (editing) {
          if (!isNormalized) {
            roomItems.forEach(normalizeItem);
            isNormalized = true;
          }
          showParameters(roomItems[0]);
        }
      }

      editToggle.addEventListener("click", () => setEditing(!editing));

      saveLayout.addEventListener("click", () => {
        if (!isNormalized) {
          roomItems.forEach(normalizeItem);
          isNormalized = true;
        }
        const layout = captureLayout();
        localStorage.setItem(layoutStorageKey, JSON.stringify(layout));
        showSavedLayout(layout);
      });

      roomItems.forEach((item) => {
        item.addEventListener("pointerenter", () => showHoverTooltip(item));
        item.addEventListener("pointerleave", hideHoverTooltip);

        item.addEventListener("pointerdown", (event) => {
          if (!editing) return;
          const itemRect = item.getBoundingClientRect();
          dragState = { item, offsetX: event.clientX - itemRect.left, offsetY: event.clientY - itemRect.top };
          item.classList.add("is-dragging");
          item.setPointerCapture(event.pointerId);
          showParameters(item);
        });

        item.addEventListener("pointermove", (event) => {
          if (!dragState || dragState.item !== item) return;
          const stageRect = roomStage.getBoundingClientRect();
          const itemRect = item.getBoundingClientRect();
          const width = usesLayoutMetrics(item)
            ? (item.offsetWidth / stageRect.width) * 100
            : (itemRect.width / stageRect.width) * 100;
          const height = usesLayoutMetrics(item)
            ? (item.offsetHeight / stageRect.height) * 100
            : (itemRect.height / stageRect.height) * 100;
          const left = clamp(((event.clientX - stageRect.left - dragState.offsetX) / stageRect.width) * 100, 0, 100 - width);
          const top = clamp(((event.clientY - stageRect.top - dragState.offsetY) / stageRect.height) * 100, 0, 100 - height);
          applyParameters(item, { left, top, width });
          showParameters(item);
        });

        item.addEventListener("pointerup", () => {
          item.classList.remove("is-dragging");
          dragState = null;
        });
      });

      cameraItem.addEventListener("click", openMemoryBox);
      cameraItem.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openMemoryBox();
        }
      });
      memoryClose.addEventListener("click", closeMemoryBox);
      memoryOverlay.addEventListener("click", (event) => {
        if (event.target === memoryOverlay) closeMemoryBox();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && memoryOverlay.classList.contains("is-open")) closeMemoryBox();
        if (event.key === "Escape" && notebookOverlay.classList.contains("is-open")) closeNotebook();
        if (event.key === "Escape" && cakeOverlay.classList.contains("is-open")) closeCakeCelebration();
      });

      notebookItem.addEventListener("click", openNotebook);
      notebookItem.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openNotebook();
        }
      });
      notebookClose.addEventListener("click", closeNotebook);
      notebookOverlay.addEventListener("click", (event) => {
        if (event.target === notebookOverlay) closeNotebook();
      });
      cakeItem.addEventListener("click", openCakeCelebration);
      cakeItem.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openCakeCelebration();
        }
      });
      cakeClose.addEventListener("click", closeCakeCelebration);
      cakeOverlay.addEventListener("click", (event) => {
        if (event.target === cakeOverlay) closeCakeCelebration();
      });
      cakeStage.addEventListener("click", blowCakeCandle);
      cakeStage.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          blowCakeCandle();
        }
      });
      messageForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const name = messageName.value.trim();
        const text = messageText.value.trim();
        if (editingMessageIndex === null) {
          addMessageCard(name, text);
        } else {
          messages[editingMessageIndex] = { ...messages[editingMessageIndex], name, text };
          saveMessages();
          renderMessagePage();
          resetMessageEditor();
        }
        if (editingMessageIndex === null) messageForm.reset();
        messageName.focus();
      });
      messageCards.addEventListener("click", (event) => {
        const action = event.target.closest("[data-message-action]");
        if (!action) return;
        const index = Number(action.dataset.messageIndex);
        if (action.dataset.messageAction === "edit") beginMessageEdit(index);
        if (action.dataset.messageAction === "remove") removeMessage(index);
      });
      messagePrevious.addEventListener("click", () => {
        messagePage -= 1;
        renderMessagePage();
      });
      messageNext.addEventListener("click", () => {
        messagePage += 1;
        renderMessagePage();
      });

      roomStage.addEventListener("wheel", (event) => {
        if (!editing) return;
        const item = event.target.closest(".room-item");
        if (!item) return;
        event.preventDefault();
        const parameters = getParameters(item);
        const scale = event.deltaY < 0 ? 1.1 : 0.9;
        const baseWidth = Number.isFinite(parameters.width) && parameters.width > 0
          ? parameters.width
          : fallbackWidth(item);
        const width = clamp(baseWidth * scale, 3, 30);
        applyParameters(item, { left: parameters.left, top: parameters.top, width });
        showParameters(item);
      }, { passive: false });

      window.addEventListener("load", () => {
        try {
          const savedLayout = JSON.parse(localStorage.getItem(layoutStorageKey));
          if (savedLayout) applyLayout(savedLayout);
        } catch {
          localStorage.removeItem(layoutStorageKey);
        }
        try {
          const savedMessages = JSON.parse(localStorage.getItem(messageStorageKey));
          if (Array.isArray(savedMessages)) messages = savedMessages;
        } catch {
          localStorage.removeItem(messageStorageKey);
        }
        renderMessagePage();
      });
    </script>
  </body>
</html>
